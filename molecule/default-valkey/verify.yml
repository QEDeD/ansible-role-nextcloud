---
- name: Verify Nextcloud systemd service
  hosts: all
  become: true
  gather_facts: false
  vars:
    nextcloud_test_base_path: /nextcloud
    nextcloud_test_identifier: nextcloud
  tasks:
    - name: Wait for Nextcloud service to become active (up to 180s)
      ansible.builtin.systemd:
        name: nextcloud-server.service
      register: nextcloud_service
      until: nextcloud_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Nextcloud service is active
      ansible.builtin.assert:
        that: nextcloud_service.status.ActiveState == 'active'
        fail_msg: "nextcloud-server.service not active ({{ nextcloud_service.status.ActiveState }})"
        success_msg: "nextcloud-server.service is active"

    - name: Read Nextcloud environment file
      ansible.builtin.slurp:
        src: "{{ nextcloud_test_base_path }}/env"
      register: nextcloud_environment_file

    - name: Assert Redis socket port in Nextcloud environment is normalized to zero
      ansible.builtin.assert:
        that:
          - "'REDIS_HOST_PORT=0' in (nextcloud_environment_file.content | b64decode).splitlines()"
        fail_msg: "Nextcloud environment does not contain the normalized Redis socket port"
        success_msg: "Nextcloud environment contains the normalized Redis socket port"

    - name: Retrieve Nextcloud service log for debugging
      when: nextcloud_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu nextcloud-server.service
      changed_when: false

    - name: Wait for Nextcloud HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:80/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: nextcloud_endpoint
      until: nextcloud_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Include systemd Docker base defaults for Redis adjustment testing
      ansible.builtin.include_role:
        name: com.devture.ansible.role.systemd_docker_base
        public: true

    - name: Persist Redis configuration through the role-owned adjustment
      vars:
        nextcloud_redis_socket_path_host: /valkey/run
        nextcloud_config_parameters: []
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        public: true
        tasks_from: adjust_config

    - name: Read persisted Redis port directly from main config.php
      ansible.builtin.command:
        argv:
          - /usr/bin/env
          - docker
          - exec
          - "--user={{ nextcloud_uid }}:{{ nextcloud_gid }}"
          - "{{ nextcloud_test_identifier }}-server"
          - php
          - -r
          - >-
            $CONFIG = [];
            require '/var/www/html/config/config.php';
            if (
              !array_key_exists('redis', $CONFIG)
              || !is_array($CONFIG['redis'])
              || !array_key_exists('port', $CONFIG['redis'])
            ) {
              echo 'missing';
              exit;
            }
            echo (string) $CONFIG['redis']['port'];
      register: nextcloud_redis_persisted_port
      changed_when: false

    - name: Assert persisted Redis socket port is normalized to zero
      ansible.builtin.assert:
        that:
          - nextcloud_redis_persisted_port.stdout | trim == '0'
        fail_msg: >-
          Nextcloud persisted Redis port is
          `{{ nextcloud_redis_persisted_port.stdout | trim }}` instead of `0`
        success_msg: "Nextcloud persisted Redis socket port is normalized to zero"

    - name: Verify a custom Redis TCP port remains effective
      vars:
        nextcloud_redis_socket_enabled: false
        nextcloud_redis_socket_path_host: ""
        nextcloud_redis_hostname: valkey
        nextcloud_redis_port: 6380
      block:
        - name: Validate a custom Redis TCP port
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
            public: true
            tasks_from: validate_config

        - name: Assert custom Redis TCP port remains effective
          ansible.builtin.assert:
            that:
              - nextcloud_environment_variables_redis_port | int == 6380
            fail_msg: "Custom Redis TCP port was not retained"
            success_msg: "Custom Redis TCP port was retained"

    - name: Verify a leading-zero Redis TCP port is normalized for JSON
      vars:
        nextcloud_redis_socket_enabled: false
        nextcloud_redis_socket_path_host: ""
        nextcloud_redis_hostname: valkey
        nextcloud_redis_port: "06379"
      block:
        - name: Validate a leading-zero Redis TCP port
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
            public: true
            tasks_from: validate_config

        - name: Assert leading-zero Redis TCP port is normalized
          ansible.builtin.assert:
            that:
              - nextcloud_environment_variables_redis_port | string == '6379'
            fail_msg: "Leading-zero Redis TCP port was not normalized"
            success_msg: "Leading-zero Redis TCP port was normalized"

    - name: Verify invalid Redis TCP ports are rejected
      ansible.builtin.include_tasks: tasks/verify-redis-port-validation.yml
      loop:
        - 0
        - 65536
        - not-a-port
      loop_control:
        loop_var: nextcloud_invalid_redis_port

    - name: Verify disabled Redis integration ignores an unused invalid port
      vars:
        nextcloud_redis_socket_enabled: false
        nextcloud_redis_socket_path_host: ""
        nextcloud_redis_hostname: ""
        nextcloud_redis_port: not-a-port
      block:
        - name: Validate disabled Redis integration with an unused invalid port
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
            public: true
            tasks_from: validate_config

        - name: Assert endpoint absence keeps Redis integration disabled
          ansible.builtin.assert:
            that:
              - not nextcloud_redis_is_configured | bool
            success_msg: "Disabled Redis integration ignores its unused port"

    - name: Assert Nextcloud HTTP endpoint responds
      ansible.builtin.assert:
        that: nextcloud_endpoint.status in [200, 302]
        fail_msg: "Nextcloud did not respond as expected ({{ nextcloud_endpoint.status | default('no response') }})"
        success_msg: "Nextcloud responded with {{ nextcloud_endpoint.status }}"

    - name: Show Nextcloud systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Nextcloud systemd: {{ nextcloud_service.status.ActiveState }}"
          - "Nextcloud HTTP: {{ nextcloud_endpoint.status }}"
