---
- name: Reset the captured Redis password validation message
  ansible.builtin.set_fact:
    nextcloud_redis_password_validation_message: ""

- name: Validate an unsupported Redis password
  block:
    - name: Run Nextcloud validation with an unsupported Redis password
      vars:
        nextcloud_redis_password: "{{ nextcloud_redis_password_validation_case.value_base64 | b64decode }}"
        # Keep this negative case independent of Valkey role defaults, which
        # are not public in this separate Molecule verify play.
        nextcloud_redis_socket_enabled: true
        nextcloud_redis_socket_path_host: /valkey/run
        nextcloud_redis_hostname: ""
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        public: true
        tasks_from: validate_config
  rescue:
    - name: Capture the Redis password validation message
      ansible.builtin.set_fact:
        nextcloud_redis_password_validation_message: "{{ ansible_failed_result.msg | default('') }}"

- name: Assert the unsupported Redis password produced the fixed validation message
  ansible.builtin.assert:
    that:
      - >-
        nextcloud_redis_password_validation_message
        ==
        "The `nextcloud_redis_password` value must be a single line and must not contain NUL characters, because it is written to a Docker environment file."
    fail_msg: "The unsupported Redis password did not produce the expected fixed validation message"
    success_msg: "The unsupported Redis password produced the expected fixed validation message"
