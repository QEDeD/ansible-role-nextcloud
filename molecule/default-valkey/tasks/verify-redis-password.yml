---
- name: Verify Valkey rejects an unauthenticated client
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - docker
      - exec
      - valkey
      - valkey-cli
      - -s
      - /run/valkey/valkey.sock
      - PING
  register: nextcloud_redis_unauthenticated_ping
  changed_when: false
  failed_when: false

- name: Assert the test Valkey instance requires authentication
  ansible.builtin.assert:
    that:
      - >-
        'NOAUTH'
        in
        (
          nextcloud_redis_unauthenticated_ping.stdout
          ~ nextcloud_redis_unauthenticated_ping.stderr
        )
    fail_msg: "The test Valkey instance accepted an unauthenticated client"
    success_msg: "The test Valkey instance requires authentication"

- name: Read the Nextcloud container environment without displaying credentials
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - docker
      - container
      - inspect
      - --format
      - "{% raw %}{{json .Config.Env}}{% endraw %}"
      - "{{ nextcloud_test_identifier }}-server"
  register: nextcloud_container_environment
  changed_when: false
  no_log: true

- name: Assert Docker retained the Redis password without displaying it
  ansible.builtin.assert:
    that:
      - >-
        (
          nextcloud_container_environment.stdout
          | from_json
          | select('match', '^REDIS_HOST_PASSWORD=')
          | first
          | regex_replace('^REDIS_HOST_PASSWORD=', '')
          | hash('sha256')
        )
        ==
        (nextcloud_test_redis_password | hash('sha256'))
    fail_msg: "Docker did not retain the configured Redis password"
    success_msg: "Docker retained the configured Redis password"
  no_log: true

- name: Hash the persisted Redis password without displaying it
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - docker
      - exec
      - "--user={{ nextcloud_uid }}:{{ nextcloud_gid }}"
      - "{{ nextcloud_test_identifier }}-server"
      - php
      - -r
      - >-
        $CONFIG = [];
        require '/var/www/html/config/config.php';
        echo hash('sha256', $CONFIG['redis']['password'] ?? '');
  register: nextcloud_redis_password_persisted_hash
  changed_when: false
  no_log: true

- name: Assert the Redis password was persisted without displaying it
  ansible.builtin.assert:
    that:
      - >-
        nextcloud_redis_password_persisted_hash.stdout
        ==
        (nextcloud_test_redis_password | hash('sha256'))
    fail_msg: "The persisted Redis password did not match the configured value"
    success_msg: "The persisted Redis password matched the configured value"
  no_log: true

- name: Write a PHP session through Nextcloud's generated Redis session handler
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - docker
      - exec
      - "--user={{ nextcloud_uid }}:{{ nextcloud_gid }}"
      - "{{ nextcloud_test_identifier }}-server"
      - php
      - -d
      - display_errors=stderr
      - -r
      - >-
        session_id('nextcloud-role-password-test');
        if (!session_start()) {
          fwrite(STDERR, 'Could not start the test session');
          exit(1);
        }
        $_SESSION['role-test'] = 'password-protected-session';
        session_write_close();
  changed_when: false
  no_log: true

- name: Read the PHP session through Nextcloud's generated Redis session handler
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - docker
      - exec
      - "--user={{ nextcloud_uid }}:{{ nextcloud_gid }}"
      - "{{ nextcloud_test_identifier }}-server"
      - php
      - -d
      - display_errors=stderr
      - -r
      - >-
        session_id('nextcloud-role-password-test');
        if (!session_start()) {
          fwrite(STDERR, 'Could not start the test session');
          exit(1);
        }
        $value = $_SESSION['role-test'] ?? '';
        $_SESSION = [];
        session_destroy();
        echo hash('sha256', $value);
  register: nextcloud_redis_session_value_hash
  changed_when: false
  no_log: true

- name: Assert the PHP session round trip used the expected value
  ansible.builtin.assert:
    that:
      - >-
        nextcloud_redis_session_value_hash.stdout
        ==
        ('password-protected-session' | hash('sha256'))
    fail_msg: "The Redis-backed PHP session round trip did not preserve its value"
    success_msg: "The Redis-backed PHP session round trip preserved its value"
  no_log: true

- name: Prepare a Redis password for config-import serialization testing
  ansible.builtin.set_fact:
    nextcloud_redis_config_import_password_test_value: 'role-test-''-"-back\slash-${HOME}-#&=,[]{}'
  no_log: true

- name: Persist serialization metacharacters through the Redis config-import layer
  vars:
    # This deliberately leaves the container and Valkey password unchanged. It
    # tests only the role-owned stdin/JSON persistence boundary; the preceding
    # tasks cover the narrower end-to-end password contract.
    nextcloud_redis_socket_enabled: true
    nextcloud_redis_socket_path_host: /valkey/run
    nextcloud_redis_hostname: ""
    nextcloud_redis_password: "{{ nextcloud_redis_config_import_password_test_value }}"
    nextcloud_config_parameters: []
  ansible.builtin.include_role:
    name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
    public: true
    tasks_from: adjust_config
  no_log: true

- name: Hash the config-import Redis password without displaying it
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - docker
      - exec
      - "--user={{ nextcloud_uid }}:{{ nextcloud_gid }}"
      - "{{ nextcloud_test_identifier }}-server"
      - php
      - -r
      - >-
        $CONFIG = [];
        require '/var/www/html/config/config.php';
        echo hash('sha256', $CONFIG['redis']['password'] ?? '');
  register: nextcloud_redis_config_import_password_hash
  changed_when: false
  no_log: true

- name: Assert config-import preserved Redis password metacharacters
  ansible.builtin.assert:
    that:
      - >-
        nextcloud_redis_config_import_password_hash.stdout
        ==
        (nextcloud_redis_config_import_password_test_value | hash('sha256'))
    fail_msg: "The config-import Redis password did not match the configured value"
    success_msg: "The config-import Redis password matched the configured value"
  no_log: true

- name: Verify invalid Redis passwords are rejected with a fixed message
  ansible.builtin.include_tasks: verify-redis-password-validation-case.yml
  loop:
    - name: carriage return
      value_base64: YmVmb3JlDWFmdGVy
    - name: line feed
      value_base64: YmVmb3JlCmFmdGVy
    - name: NUL
      value_base64: YmVmb3JlAGFmdGVy
  loop_control:
    loop_var: nextcloud_redis_password_validation_case
    label: "{{ nextcloud_redis_password_validation_case.name }}"
