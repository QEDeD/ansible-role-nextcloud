---
- name: Check existence of Nextcloud systemd services
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ nextcloud_identifier }}-{{ item }}"
  loop:
    - server.service
    - cron.service
    - cron.timer
    - app-update.service
    - app-update.timer
  register: nextcloud_systemd_service_stats

- name: Ensure existing Nextcloud systemd services are stopped
  when: item.stat.exists | bool
  ansible.builtin.service:
    name: "{{ nextcloud_identifier }}-{{ item.item }}"
    state: stopped
    enabled: false
    daemon_reload: true
  loop: "{{ nextcloud_systemd_service_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure Nextcloud systemd services do not exist
  ansible.builtin.file:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ nextcloud_identifier }}-{{ item }}"
    state: absent
  loop:
    - server.service
    - cron.service
    - cron.timer
    - app-update.service
    - app-update.timer
  register: nextcloud_systemd_service_files_deletion

- name: Reload systemd after removing Nextcloud services
  when: nextcloud_systemd_service_files_deletion.changed | bool
  ansible.builtin.systemd_service:
    daemon_reload: true

# These runtime/configuration artifacts are role-owned. Their disabled desired
# state is absence even if no service unit was ever created, or an earlier
# uninstall removed the unit before it reached the remaining cleanup tasks.
- name: Ensure Nextcloud support files do not exist
  ansible.builtin.file:
    path: "{{ nextcloud_base_path }}/{{ item }}"
    state: absent
  loop:
    - env
    - labels

- name: Ensure Nextcloud image source files path does not exist
  ansible.builtin.file:
    path: "{{ nextcloud_customized_container_src_path }}"
    state: absent

- name: Ensure Nextcloud Redis session ini file does not exist
  ansible.builtin.file:
    path: "{{ nextcloud_redis_session_ini_path }}"
    state: absent

- name: Ensure Nextcloud local data path does not exist if empty
  ansible.builtin.command:
    cmd: "rmdir {{ nextcloud_data_path }}"
  register: nextcloud_data_path_deletion_result
  changed_when: nextcloud_data_path_deletion_result.rc == 0
  failed_when: false

- name: Ensure Nextcloud base path does not exist if empty
  ansible.builtin.command:
    cmd: "rmdir {{ nextcloud_base_path }}"
  register: nextcloud_base_path_deletion_result
  changed_when: nextcloud_base_path_deletion_result.rc == 0
  failed_when: false

- name: Ensure Nextcloud container network does not exist
  when: nextcloud_container_network_deletion_enabled
  block:
    - name: Ensure Nextcloud container network does not exist via community.docker.docker_network
      when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
      community.docker.docker_network:
        name: "{{ nextcloud_container_network }}"
        state: absent
      register: nextcloud_network_deletion_result

    - name: Ensure Nextcloud container network does not exist via ansible.builtin.command
      when: devture_systemd_docker_base_container_network_creation_method == 'command'
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} network rm
          {{ nextcloud_container_network }}
      register: nextcloud_network_deletion_result
      changed_when: nextcloud_network_deletion_result.rc == 0
      failed_when: >-
        nextcloud_network_deletion_result.rc != 0
        and (
          nextcloud_network_deletion_result.rc != 1
          or (
            (
              'network ' ~ (nextcloud_container_network | lower) ~ ' not found'
            ) not in (nextcloud_network_deletion_result.stderr | lower)
            and (
              'no such network: ' ~ (nextcloud_container_network | lower)
            ) not in (nextcloud_network_deletion_result.stderr | lower)
          )
        )

- name: Check existence of Nextcloud local data path
  ansible.builtin.stat:
    path: "{{ nextcloud_data_path }}"
  register: nextcloud_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining Nextcloud local data path
  when: nextcloud_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local Nextcloud instance has been removed, some old data remains in `" + nextcloud_data_path + "`. Feel free to delete it."
        ]
      }}
