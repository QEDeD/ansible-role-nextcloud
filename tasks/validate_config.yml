---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "nextcloud_config_path", "new": "<Removed>" }
    - { "old": "nextcloud_container_additional_mounts", "new": "nextcloud_container_additional_volumes" }
    - { "old": "nextcloud_preview_squareSizes", "new": "<removed>" }
    - { "old": "nextcloud_preview_widthSizes", "new": "<removed>" }
    - { "old": "nextcloud_preview_heightSizes", "new": "<removed>" }
    - { "old": "nextcloud_preview_system_jpeg_quality", "new": "<removed>" }
    - "old": "nextcloud_container_image_customizations_php_imageick_installation_enabled"
      "new": "nextcloud_container_image_customizations_php_imagick_installation_enabled"
    - "old": "nextcloud_container_image_customizations_php_imageick_installation_package"
      "new": "nextcloud_container_image_customizations_php_imagick_installation_packages"
    - { "old": "nextcloud_container_additional_environment_variables", "new": "nextcloud_environment_variables_additional_variables" }
    - { "old": "nextcloud_config_default_parameters", "new": "nextcloud_config_parameters_default" }
    - { "old": "nextcloud_config_additional_parameters", "new": "nextcloud_config_parameters_custom" }
    - { "old": "nextcloud_config_parameter_mail_smtphost", "new": "nextcloud_environment_variables_smtp_host" }
    - { "old": "nextcloud_config_parameter_mail_smtpport", "new": "nextcloud_environment_variables_smtp_port" }
    - { "old": "nextcloud_config_parameter_mail_smtpsecure", "new": "nextcloud_environment_variables_smtp_secure" }
    - { "old": "nextcloud_config_parameter_mail_smtpauth", "new": "nextcloud_environment_variables_smtp_authtype" }
    - { "old": "nextcloud_config_parameter_mail_smtpname", "new": "nextcloud_environment_variables_smtp_name" }
    - { "old": "nextcloud_config_parameter_mail_smtppassword", "new": "nextcloud_environment_variables_smtp_password" }
    - { "old": "nextcloud_config_parameter_mail_from_address", "new": "nextcloud_environment_variables_mail_from_address" }
    - { "old": "nextcloud_config_parameter_mail_domain", "new": "nextcloud_environment_variables_mail_domain" }
    - { "old": "nextcloud_app_collabora_wopi_url", "new": "nextcloud_app_richdocuments_wopi_client_url" }
    - { "old": "nextcloud_app_collabora_wopi_allowlist", "new": "nextcloud_app_richdocuments_wopi_client_allowlist" }
    - { "old": "nextcloud_auto_app_update_enabled", "new": "nextcloud_app_autoupdate_enabled" }
    - { "old": "nextcloud_auto_app_update_schedule", "new": "nextcloud_app_autoupdate_schedule" }
    - { "old": "nextcloud_http_header_content_permission_policy", "new": "nextcloud_http_header_permissions_policy" }
    - { "old": "nextcloud_database_hostname", "new": "nextcloud_database_postgres_hostname" }
    - { "old": "nextcloud_database_port", "new": "nextcloud_database_postgres_port" }
    - { "old": "nextcloud_database_username", "new": "nextcloud_database_postgres_username" }
    - { "old": "nextcloud_database_password", "new": "nextcloud_database_postgres_password" }
    - { "old": "nextcloud_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Nextcloud settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item.name }}`).
  when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
  with_items:
    - { "name": "nextcloud_uid", when: true }
    - { "name": "nextcloud_gid", when: true }
    - { "name": "nextcloud_hostname", when: true }
    - { "name": "nextcloud_container_network", when: true }
    - "name": "nextcloud_environment_variables_nextcloud_admin_password"
      when: "{{ nextcloud_environment_variables_nextcloud_admin_user != '' }}"

- name: Fail if Nextcloud log type is invalid
  ansible.builtin.fail:
    msg: >-
      nextcloud_config_parameter_log_type must be 'file', 'syslog', 'errorlog', or 'systemd'
  when: "nextcloud_config_parameter_log_type not in ['file', 'syslog', 'errorlog', 'systemd']"

- name: Fail if Nextcloud database type is invalid
  ansible.builtin.fail:
    msg: >-
      nextcloud_database_type must be 'mysql', 'postgres' or 'sqlite'
  when: "nextcloud_database_type not in ['mysql', 'postgres', 'sqlite']"

- name: Run if Nextcloud + MySQL integration is enabled
  when: nextcloud_database_type == 'mysql'
  block:
    - name: Fail if required Nextcloud + MySQL integration settings not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`) when `nextcloud_database_type` is `mysql`
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - nextcloud_database_mysql_password

    - name: Fail if MySQL socket host path for Nextcloud is missing when Unix socket is enabled
      ansible.builtin.fail:
        msg: >-
          You need to define `nextcloud_database_mysql_socket_path_host` when `nextcloud_database_type` is `mysql`
          and `nextcloud_database_mysql_socket_enabled` is `true`.
      when: >-
        nextcloud_database_mysql_socket_enabled and
        nextcloud_database_mysql_socket_path_host | string | length == 0

    - name: Fail if MySQL hostname for Nextcloud is missing when Unix socket is disabled
      ansible.builtin.fail:
        msg: >-
          You need to define `nextcloud_database_mysql_hostname` when `nextcloud_database_type` is `mysql`
          and `nextcloud_database_mysql_socket_enabled` is `false`.
      when: >-
        not nextcloud_database_mysql_socket_enabled and
        nextcloud_database_mysql_hostname | string | length == 0

- name: Run if Nextcloud + Postgres integration is enabled
  when: nextcloud_database_type == 'postgres'
  block:
    - name: Fail if required Nextcloud + Postgres integration settings not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`) when `nextcloud_database_type` is `postgres`
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - nextcloud_database_postgres_password

    - name: Fail if Postgres socket host path for Nextcloud is missing when Unix socket is enabled
      ansible.builtin.fail:
        msg: >-
          You need to define `nextcloud_database_postgres_socket_path_host` when `nextcloud_database_type` is `postgres`
          and `nextcloud_database_postgres_socket_enabled` is `true`.
      when: >-
        nextcloud_database_postgres_socket_enabled and
        nextcloud_database_postgres_socket_path_host | string | length == 0

    - name: Fail if Postgres hostname for Nextcloud is missing when Unix socket is disabled
      ansible.builtin.fail:
        msg: >-
          You need to define `nextcloud_database_postgres_hostname` when `nextcloud_database_type` is `postgres`
          and `nextcloud_database_postgres_socket_enabled` is `false`.
      when: >-
        not nextcloud_database_postgres_socket_enabled and
        nextcloud_database_postgres_hostname | string | length == 0

- name: Run if Nextcloud + Redis integration is enabled
  when: nextcloud_redis_is_configured | bool
  block:
    - name: Fail if Redis endpoint and transport settings conflict
      vars:
        nextcloud_redis_both_endpoints_configured: >-
          {{
            nextcloud_redis_hostname | string | length != 0 and
            nextcloud_redis_socket_path_host | string | length != 0
          }}
        nextcloud_redis_hostname_with_socket_transport: >-
          {{
            nextcloud_redis_hostname | string | length != 0 and
            nextcloud_redis_socket_enabled | bool
          }}
        nextcloud_redis_socket_path_with_tcp_transport: >-
          {{
            nextcloud_redis_socket_path_host | string | length != 0 and
            not nextcloud_redis_socket_enabled | bool
          }}
        nextcloud_redis_conflict_observed: >-
          {{
            'Both `nextcloud_redis_hostname` and `nextcloud_redis_socket_path_host` are non-empty, so two alternative endpoints are configured.'
            if nextcloud_redis_both_endpoints_configured | bool
            else
            '`nextcloud_redis_socket_enabled` selects a Unix socket, but `nextcloud_redis_hostname` configures a TCP endpoint.'
            if nextcloud_redis_hostname_with_socket_transport | bool
            else
            '`nextcloud_redis_socket_path_host` configures a Unix-socket endpoint, but `nextcloud_redis_socket_enabled` selects TCP.'
          }}
      ansible.builtin.fail:
        msg: |-
          Invalid Redis target state.

          Observed: {{ nextcloud_redis_conflict_observed }}
          The role cannot infer whether the endpoint setting or the transport selector is stale.

          Redis integration is enabled by either endpoint variable;
          `nextcloud_redis_socket_enabled` only selects the transport.

          Choose exactly one target state:
          - Unix socket: set `nextcloud_redis_socket_enabled: true`, set
            `nextcloud_redis_socket_path_host`, and clear `nextcloud_redis_hostname`.
            The effective port is always `0`; `nextcloud_redis_port` is ignored.
          - TCP: set `nextcloud_redis_socket_enabled: false`, set
            `nextcloud_redis_hostname`, clear `nextcloud_redis_socket_path_host`,
            and set `nextcloud_redis_port` to a whole number from 1 through 65535.
          - Disabled: clear both endpoint variables. The selector and port are ignored.

          "Clear" means the effective value must be empty; remove its source or override
          an inherited value with `""`.

          A Unix socket must be available on the same host operating system that runs
          the Nextcloud container. A TCP hostname must be reachable from inside the container.
          {% if nextcloud_redis_socket_path_with_tcp_transport | bool and not nextcloud_redis_both_endpoints_configured | bool %}
          Migration hint: version `v33.0.2-3` changed the selector default to `false`.
          If this inventory intentionally used a socket and omitted the selector,
          set `nextcloud_redis_socket_enabled: true` explicitly.
          {% endif %}
          See "Changing or disabling Redis integration" in `docs/configuring-nextcloud.md`.
      when: >-
        nextcloud_redis_both_endpoints_configured | bool or
        nextcloud_redis_hostname_with_socket_transport | bool or
        nextcloud_redis_socket_path_with_tcp_transport | bool

    - name: Fail if Redis TCP port is invalid
      ansible.builtin.fail:
        msg: |-
          Invalid Redis TCP port: `nextcloud_redis_port` resolves to
          {{ nextcloud_redis_port | to_json }}, but a configured TCP endpoint requires
          a whole-number port from 1 through 65535.

          The role cannot infer whether the port or TCP endpoint is stale:
          - Keep TCP: correct `nextcloud_redis_port`.
          - Use a Unix socket: select socket mode, configure its host directory,
            and clear the TCP hostname. The raw port is ignored and the effective
            port is `0`.
          - Disable Redis: clear both endpoints. The selector and port are ignored.
      when: >-
        not nextcloud_redis_socket_enabled | bool and
        (
          nextcloud_redis_port | string | regex_search('^[0-9]+$') is none or
          nextcloud_redis_port | int < 1 or
          nextcloud_redis_port | int > 65535
        )

- name: Fail if SMTP settings are missing (and SMTP is enabled by setting host)
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) to correctly set up email via SMTP.
  when: "nextcloud_environment_variables_smtp_host != '' and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - nextcloud_environment_variables_smtp_host
    - nextcloud_environment_variables_mail_from_address
    - nextcloud_environment_variables_mail_domain

- name: Run if Preview Generator is enabled
  when: nextcloud_preview_enabled | bool
  block:
    - name: Fail if Preview Generator settings required for Nextcloud are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - nextcloud_preview_preview_max_x
        - nextcloud_preview_preview_max_y

- name: Run if Traefik is enabled
  when: nextcloud_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Nextcloud are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "nextcloud_container_labels_traefik_hostname", when: true }
        - { "name": "nextcloud_container_labels_traefik_path_prefix", when: true }
        - { "name": "nextcloud_container_labels_traefik_compression_middleware_name", when: "{{ nextcloud_container_labels_traefik_compression_middleware_enabled }}" }

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `nextcloud_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if nextcloud_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          nextcloud_container_labels_traefik_path_prefix (`{{ nextcloud_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/nextcloud`).
      when: "nextcloud_container_labels_traefik_path_prefix != '/' and nextcloud_container_labels_traefik_path_prefix[-1] == '/'"
